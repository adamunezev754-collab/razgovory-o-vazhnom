{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Разговоры о важном{% endblock %}</title>
    
    <!-- Шрифт Days One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: 'Days One', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, .logo-text {
            font-family: 'Days One', sans-serif;
            font-weight: 400;
        }
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo img {
            max-height: 50px;
        }
        .logo-text {
            font-size: 20px;
            color: var(--primary-color);
            text-decoration: none;
        }
        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 400;
            font-size: 14px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: var(--primary-color);
        }
        main {
            flex: 1;
            padding: 40px 0;
        }
        footer {
            background-color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 25px 0;
            color: #64748b;
            font-size: 13px;
            margin-top: auto;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="{% url 'home' %}" class="logo">
                {% if settings and settings.logo %}
                    <img src="{{ settings.logo.url }}" alt="Логотип">
                {% else %}
                    <span class="logo-text">РАЗГОВОРЫ О ВАЖНОМ</span>
                {% endif %}
            </a>
            <nav>
                <a href="{% url 'home' %}">Главная</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            &copy; 2026. Система «Разговоры о важном».
        </div>
    </footer>
</body>
</html>
